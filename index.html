<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Server Demonlist</title>
    <style>
        /* Общие настройки футуристичной темной темы */
        body { 
            background: radial-gradient(circle at top, #1a1c23 0%, #0f1015 100%); 
            color: #f1f2f6; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }
        .container { display: flex; gap: 35px; max-width: 1400px; margin: 0 auto; }
        .main-content { flex: 2; background: rgba(23, 24, 28, 0.6); padding: 30px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 25px; }
        .panel { background: rgba(28, 29, 34, 0.8); padding: 25px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; margin-top: 0; margin-bottom: 25px; background: linear-gradient(45deg, #ff4a4a, #ffb84d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.4rem; font-weight: 700; margin-top: 0; margin-bottom: 20px; color: #fff; border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        /* Прокачанный дизайн карточек уровней */
        .demon-card-wrapper { 
            background: rgba(33, 35, 41, 0.5); 
            margin: 15px 0; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 74, 74, 0.15);
            border-left: 6px solid #ff4a4a; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }
        /* Свечение и подъем карточки при наведении */
        .demon-card-wrapper:hover { 
            transform: translateY(-4px);
            background: rgba(40, 43, 51, 0.7);
            border-color: rgba(255, 74, 74, 0.4);
            box-shadow: 0 10px 20px rgba(255, 74, 74, 0.1);
        }
        /* Дизайн активной выбранной карточки */
        .demon-card-wrapper.active { 
            border-left-color: #00ff66; 
            border-color: rgba(0, 255, 102, 0.3);
            background: linear-gradient(90deg, rgba(30, 41, 34, 0.6) 0%, rgba(24, 26, 31, 0.6) 100%); 
            box-shadow: 0 10px 25px rgba(0, 255, 102, 0.15);
        }
        
        .demon-card-wrapper h3 { font-size: 1.3rem; margin: 0 0 8px 0; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .demon-card-wrapper p { color: #9da2af; font-size: 0.95rem; margin: 0; }
        
        /* Стили полей ввода формы */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #8a8d98; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 8px; background: #121316; border: 1px solid #2d3039; color: #fff; font-size: 0.95rem; box-sizing: border-box; transition: all 0.2s; }
        input:focus { border-color: #ff4a4a; outline: none; box-shadow: 0 0 0 3px rgba(255, 74, 74, 0.2); }
        
        /* Красивые сочные кнопки */
        button { width: 100%; padding: 12px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px; border: none; border-radius: 8px; transition: all 0.2s ease; transform: translateZ(0); }
        button:active { transform: scale(0.98); }
        
        /* Стилизация блока победителей */
        .victors-list { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
        .victors-list strong { color: #ffb84d; display: block; margin-bottom: 8px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .victor-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin: 6px 0; border: 1px solid rgba(255,255,255,0.02); }
        .victor-item a { color: #4af3ff; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .victor-item a:hover { color: #fff; text-shadow: 0 0 8px #4af3ff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-content">
            <h1>Server Demonlist</h1>
            <div id="demons-list">Загрузка списка...</div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h2 id="form-title">Добавить уровень</h2>
                <div class="form-group"><label>Позиция</label><input type="number" id="form-position"></div>
                <div class="form-group"><label>Название</label><input type="text" id="form-name"></div>
                <div class="form-group"><label>Создатель</label><input type="text" id="form-creator"></div>
                <div class="form-group"><label>Верификатор</label><input type="text" id="form-verifier"></div>
                
                <div class="form-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1);">
                    <label style="color: #ffb84d; font-weight: bold;">🔑 Код администратора</label>
                    <input type="password" id="form-admin-code" placeholder="Введите ваш секретный код">
                </div>

                <button onclick="saveDemonChanges()" style="background: linear-gradient(135deg, #ff4a4a 0%, #dd2a2a 100%); color:#fff; box-shadow: 0 4px 15px rgba(255,74,74,0.3);">Сохранить уровень</button>
                <button id="btn-cancel-edit" onclick="createNewDemonFields()" style="background:#4a4d55; color:#fff; display:none;">Отменить редактирование</button>
                <button id="btn-clear-fields" onclick="clearFormInputOnly()" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid rgba(255,255,255,0.1);">Очистить поля</button>
                <button id="btn-delete-demon" onclick="deleteDemon()" style="background: linear-gradient(135deg, #cc2424 0%, #a01818 100%); color:#fff; display:none;">Удалить этот уровень</button>
            </div>

            <div class="panel" id="victor-panel" style="display: none;">
                <h2>Добавить рекорд</h2>
                <div class="form-group"><label>Игрок (Виктор)</label><input type="text" id="victor-name"></div>
                <div class="form-group"><label>Видео (YouTube)</label><input type="url" id="victor-video"></div>
                <button onclick="addVictor()" style="background: linear-gradient(135deg, #00ff66 0%, #00c850 100%); color:#000; box-shadow: 0 4px 15px rgba(0,255,102,0.2);">Записать рекорд</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_ADMIN_CODE = '090909';
        let selectedId = null;

        window.onload = function() { 
            if (!localStorage.getItem('local_db_v3')) {
                const startData = [{ id: "id_1", position: 1, name: "Acheron", creator: "Riot", verifier: "Riot", victors: [] }];
                localStorage.setItem('local_db_v3', JSON.stringify(startData));
            }
            loadDemons(); 
        };

        function checkAdmin() {
            const inputCode = document.getElementById('form-admin-code').value;
            if (inputCode !== SECRET_ADMIN_CODE) {
                alert("Ошибка: Неверный код администратора!");
                return false;
            }
            return true;
        }
        function loadDemons() {
            const list = document.getElementById('demons-list');
            list.innerHTML = '';
            
            const data = JSON.parse(localStorage.getItem('local_db_v3') || '[]');
            if (data.length === 0) { list.innerHTML = 'Лист пуст.'; return; }
            
            data.sort((a, b) => a.position - b.position);
            data.forEach(d => {
                const isSelected = selectedId === d.id;
                const wrapper = document.createElement('div');
                wrapper.className = `demon-card-wrapper ${isSelected ? 'active' : ''}`;
                
                // Добавляем красивую подсветку для ТОП-мест
                let posColor = '#ff4a4a';
                if (d.position === 1) posColor = '#ffd700'; // Золото для Топ-1
                if (d.position === 2) posColor = '#c0c0c0'; // Серебро для Топ-2
                if (d.position === 3) posColor = '#cd7f32'; // Бронза для Топ-3
                
                wrapper.style.borderLeftColor = posColor;
                
                let html = `
                    <div onclick='selectDemon(${JSON.stringify(d)})'>
                        <h3><span style="color: ${posColor}">#${d.position}</span> - ${d.name}</h3>
                        <p>Создатель: <span style="color:#fff">${d.creator}</span> | Верификатор: <span style="color:#fff">${d.verifier || 'Не указан'}</span></p>
                    </div>
                `;

                if (d.victors && d.victors.length > 0) {
                    html += `<div class="victors-list"><strong>🏆 Победители списка:</strong>`;
                    d.victors.forEach(v => {
                        html += `<div class="victor-item"><span>👤 ${v.name}</span><a href="${v.video}" target="_blank">🎬 Смотреть клип</a></div>`;
                    });
                    html += `</div>`;
                }
                wrapper.innerHTML = html;
                list.appendChild(wrapper);
            });
        }

        function selectDemon(demon) {
            selectedId = demon.id;
            document.getElementById('form-title').innerText = "Редактировать уровень";
            document.getElementById('form-position').value = demon.position;
            document.getElementById('form-name').value = demon.name;
            document.getElementById('form-creator').value = demon.creator;
            document.getElementById('form-verifier').value = demon.verifier || '';
            
            document.getElementById('btn-delete-demon').style.display = 'block';
            document.getElementById('btn-cancel-edit').style.display = 'block';
            document.getElementById('btn-clear-fields').style.display = 'none';
            document.getElementById('victor-panel').style.display = 'block';
            loadDemons();
        }

        function createNewDemonFields() {
            selectedId = null;
            document.getElementById('form-title').innerText = "Добавить уровень";
            clearFormInputOnly();
            document.getElementById('btn-delete-demon').style.display = 'none';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            document.getElementById('btn-clear-fields').style.display = 'block';
            document.getElementById('victor-panel').style.display = 'none';
            loadDemons();
        }

        function clearFormInputOnly() {
            document.getElementById('form-position').value = '';
            document.getElementById('form-name').value = '';
            document.getElementById('form-creator').value = '';
            document.getElementById('form-verifier').value = '';
            document.getElementById('form-admin-code').value = '';
        }

        function saveDemonChanges() {
            if (!checkAdmin()) return;

            const position = document.getElementById('form-position').value;
            const name = document.getElementById('form-name').value;
            const creator = document.getElementById('form-creator').value;
            const verifier = document.getElementById('form-verifier').value;
            if (!position || !name || !creator || !verifier) { alert("Заполните все поля!"); return; }

            let demons = JSON.parse(localStorage.getItem('local_db_v3') || '[]');

            if (selectedId !== null) {
                const demon = demons.find(d => d.id === selectedId);
                if (demon) {
                    demon.position = parseInt(position);
                    demon.name = name;
                    demon.creator = creator;
                    demon.verifier = verifier;
                }
            } else {
                const newDemon = {
                    id: "id_" + Date.now(),
                    position: parseInt(position),
                    name: name,
                    creator: creator,
                    verifier: verifier,
                    victors: []
                };
                demons.push(newDemon);
            }

            localStorage.setItem('local_db_v3', JSON.stringify(demons));
            alert("Уровень успешно сохранен!");
            createNewDemonFields();
        }

        function deleteDemon() {
            if (!checkAdmin()) return;
            if (selectedId === null || !confirm("Вы уверены, что хотите НАВСЕГДА удалить уровень?")) return;
            
            let demons = JSON.parse(localStorage.getItem('local_db_v3') || '[]');
            demons = demons.filter(d => d.id !== selectedId);
            
            localStorage.setItem('local_db_v3', JSON.stringify(demons));
            alert("Уровень успешно удален!");
            createNewDemonFields();
        }

        function addVictor() {
            if (!checkAdmin()) return;

            const nInput = document.getElementById('victor-name');
            const vInput = document.getElementById('victor-video');
            if (!nInput.value || !vInput.value || selectedId === null) { alert("Заполните поля рекорда!"); return; }
            
            let demons = JSON.parse(localStorage.getItem('local_db_v3') || '[]');
            const demon = demons.find(d => d.id === selectedId);
            if (demon) {
                if (!demon.victors) demon.victors = [];
                demon.victors.push({ name: nInput.value, video: vInput.value });
                localStorage.setItem('local_db_v3', JSON.stringify(demons));
                alert("Рекорд записан!");
                nInput.value = '';
                vInput.value = '';
                loadDemons();
            }
        }
    </script>
</body>
</html>
