<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Server Demonlist</title>
    <!-- ПОДКЛЮЧАЕМ НАШ ОТДЕЛЬНЫЙ CSS ФАЙЛ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="main-content">
            <h1>Server Demonlist</h1>
            <div id="demons-list">Загрузка списка...</div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h2 id="form-title">Добавить уровень</h2>
                <div class="form-group"><label>Позиция в топе</label><input type="number" id="form-position"></div>
                <div class="form-group"><label>Название демона</label><input type="text" id="form-name"></div>
                <div class="form-group"><label>Создатель</label><input type="text" id="form-creator"></div>
                <div class="form-group"><label>Верификатор (необязательно)</label><input type="text" id="form-verifier"></div>
                <div class="form-group"><label style="color: #ffb84d;">📉 Минимальный процент листа (%)</label><input type="number" id="form-min-percent" value="100" min="0" max="100"></div>
                
                <div class="form-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1);">
                    <label style="color: #ffb84d; font-weight: bold;">🔑 Код администратора</label>
                    <input type="password" id="form-admin-code" placeholder="Введите ваш секретный код">
                </div>

                <button onclick="saveDemonChanges()" style="background: linear-gradient(135deg, #ff4a4a 0%, #dd2a2a 100%); color:#fff;">Сохранить уровень</button>
                <button id="btn-cancel-edit" onclick="createNewDemonFields()" style="background:#4a4d55; color:#fff; display:none;">Отменить редактирование</button>
                <button id="btn-clear-fields" onclick="clearFormInputOnly()" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid rgba(255,255,255,0.1);">Очистить поля</button>
                <button id="btn-delete-demon" onclick="deleteDemon()" style="background: linear-gradient(135deg, #cc2424 0%, #a01818 100%); color:#fff; display:none;">Удалить этот уровень</button>
            </div>

            <div class="panel" id="victor-panel" style="display: none;">
                <h2>Добавить рекорд / Процент</h2>
                <div class="form-group"><label>Игрок</label><input type="text" id="victor-name"></div>
                <div class="form-group"><label>Набранный процент (%)</label><input type="number" id="victor-percent" value="100" min="0" max="100"></div>
                <div class="form-group"><label>Видео (YouTube)</label><input type="url" id="victor-video"></div>
                <button onclick="addVictor()" style="background: linear-gradient(135deg, #00ff66 0%, #00c850 100%); color:#000;">Записать рекорд</button>
            </div>

            <div class="panel">
                <h2>🏆 Топ-5 лидеров</h2>
                <div id="leaderboard-content">Подсчет очков...</div>
            </div>
        </div>
    </div>

    <script>
        const SECRET_ADMIN_CODE = '090909';
        let selectedId = null;

        window.onload = function() { 
            loadDemons(); 
            setInterval(loadDemons, 3000); 
        };

        function checkAdmin() {
            const inputCode = document.getElementById('form-admin-code').value;
            if (inputCode !== SECRET_ADMIN_CODE) {
                alert("Ошибка: Неверный код администратора!");
                return false;
            }
            return true;
        }
        function calculatePoints(position, percent, minPercent, totalDemons) {
            if (percent < minPercent) return 0;
            let maxPoints = 250 - (position - 1) * (200 / Math.max(totalDemons, 1));
            if (maxPoints < 10) maxPoints = 10; 
            if (parseInt(percent) === 100) {
                return Math.round(maxPoints * 10) / 10;
            } else {
                let percentPoints = maxPoints * ((percent - minPercent) / (100 - minPercent)) * 0.6;
                return Math.round(percentPoints * 10) / 10;
            }
        }

        async function loadDemons() {
            const list = document.getElementById('demons-list');
            try {
                const response = await fetch('/api/demons?t=' + Date.now());
                const data = await response.json();
                
                if (!data || data.length === 0) { 
                    list.innerHTML = 'Лист пуст.'; 
                    document.getElementById('leaderboard-content').innerHTML = 'Пока нет записанных рекордов.';
                    return; 
                }
                
                data.sort((a, b) => a.position - b.position);
                let playerScores = {};
                let newHtml = '';

                data.forEach(d => {
                    const isSelected = selectedId === d.id;
                    let posColor = '#ff4a4a';
                    if (d.position === 1) posColor = '#ffd700';
                    if (d.position === 2) posColor = '#c0c0c0';
                    if (d.position === 3) posColor = '#cd7f32';
                    
                    newHtml += `<div class="demon-card-wrapper ${isSelected ? 'active' : ''}" style="border-left-color: ${posColor}">
                        <div onclick='selectDemon(${JSON.stringify(d)})'>
                            <h3><span style="color: ${posColor}">#${d.position}</span> - ${d.name}</h3>
                            <p>Создатель: <span style="color:#fff">${d.creator}</span> | Верификатор: <span style="color:#fff">${d.verifier || 'Не указан'}</span> | Мин. процент: <span style="color:#ffb84d">${d.minPercent || 100}%</span></p>
                        </div>
                    `;

                    if (d.victors && d.victors.length > 0) {
                        newHtml += `<div class="victors-list"><strong>🏆 Рекорды:</strong>`;
                        d.victors.forEach(v => {
                            let pts = calculatePoints(d.position, v.percent || 100, d.minPercent || 100, data.length);
                            newHtml += `<div class="victor-item">
                                <span>👤 <b>${v.name}</b> — ${v.percent || 100}% (<span style="color:#00ff66">+${pts} PTS</span>)</span>
                                <a href="${v.video}" target="_blank" class="video-btn">▶ Видео</a>
                            </div>`;
                            if (!playerScores[v.name]) playerScores[v.name] = 0;
                            playerScores[v.name] += pts;
                        });
                        newHtml += `</div>`;
                    }
                    newHtml += `</div>`;
                });

                if (list.innerHTML !== newHtml) { list.innerHTML = newHtml; }
                renderLeaderboard(playerScores);
            } catch (e) { list.innerHTML = 'Нет связи с сервером.'; }
        }
        function renderLeaderboard(scores) {
            const board = document.getElementById('leaderboard-content');
            let sortedPlayers = Object.keys(scores)
                .map(name => ({ name: name, score: Math.round(scores[name] * 10) / 10 }))
                .sort((a,b) => b.score - a.score)
                .slice(0, 5); 
            
            if (sortedPlayers.length === 0) {
                board.innerHTML = 'Пока нет записанных рекордов.';
                return;
            }

            let html = `<table class="leaderboard-table"><tr><th>Место</th><th>Игрок</th><th>Очки</th></tr>`;
            sortedPlayers.forEach((p, index) => {
                let badgeStyle = "background: rgba(255,255,255,0.1); color: #fff;";
                if (index === 0) badgeStyle = "background: #ffd700; color: #000;";
                if (index === 1) badgeStyle = "background: #c0c0c0; color: #000;";
                if (index === 2) badgeStyle = "background: #cd7f32; color: #000;";
                
                html += `<tr>
                    <td><span class="rank-badge" style="${badgeStyle}">${index + 1}</span></td>
                    <td><b>${p.name}</b></td>
                    <td style="color: #00ff66; font-weight: bold;">${p.score}</td>
                </tr>`;
            });
            html += `</table>`;
            if (board.innerHTML !== html) { board.innerHTML = html; }
        }

        function selectDemon(demon) {
            selectedId = demon.id;
            document.getElementById('form-title').innerText = "Редактировать уровень";
            document.getElementById('form-position').value = demon.position;
            document.getElementById('form-name').value = demon.name;
            document.getElementById('form-creator').value = demon.creator;
            document.getElementById('form-verifier').value = demon.verifier || '';
            document.getElementById('form-min-percent').value = demon.minPercent || 100;
            
            document.getElementById('btn-delete-demon').style.display = 'block';
            document.getElementById('btn-cancel-edit').style.display = 'block';
            document.getElementById('btn-clear-fields').style.display = 'none';
            document.getElementById('victor-panel').style.display = 'block';
        }

        function createNewDemonFields() {
            selectedId = null;
            document.getElementById('form-title').innerText = "Добавить уровень";
            clearFormInputOnly();
            document.getElementById('btn-delete-demon').style.display = 'none';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            document.getElementById('btn-clear-fields').style.display = 'block';
            document.getElementById('victor-panel').style.display = 'none';
        }

        function clearFormInputOnly() {
            document.getElementById('form-position').value = '';
            document.getElementById('form-name').value = '';
            document.getElementById('form-creator').value = '';
            document.getElementById('form-verifier').value = '';
            document.getElementById('form-min-percent').value = '100';
            document.getElementById('form-admin-code').value = '';
        }

        async function saveDemonChanges() {
            if (!checkAdmin()) return;
            const adminCode = document.getElementById('form-admin-code').value;
            const position = document.getElementById('form-position').value;
            const name = document.getElementById('form-name').value;
            const creator = document.getElementById('form-creator').value;
            const minPercent = document.getElementById('form-min-percent').value;
            
            let verifier = document.getElementById('form-verifier').value;
            if (!verifier || verifier.trim() === "") { verifier = "Не указан"; }
            if (!position || !name || !creator || !minPercent) { alert("Заполните Позицию, Название и Создателя!"); return; }

            const body = { position: parseInt(position), name, creator, verifier, minPercent, id: selectedId };
            try {
                const url = selectedId !== null ? `/api/demons/update` : `/api/demons/add`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-code': adminCode },
                    body: JSON.stringify(body)
                });
                if (res.ok) { alert("Уровень успешно сохранен в облако Redis!"); createNewDemonFields(); }
            } catch (e) { alert("Ошибка сохранения."); }
        }

        async function deleteDemon() {
            if (!checkAdmin()) return;
            if (selectedId === null || !confirm("Вы уверены?")) return;
            const adminCode = document.getElementById('form-admin-code').value;
            try {
                const res = await fetch('/api/demons/delete', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-code': adminCode },
                    body: JSON.stringify({ id: selectedId })
                });
                if (res.ok) { alert("Удалено для всех!"); createNewDemonFields(); }
            } catch (e) { alert("Ошибка удаления."); }
        }

        async function addVictor() {
            if (!checkAdmin()) return;
            const adminCode = document.getElementById('form-admin-code').value;
            const nInput = document.getElementById('victor-name');
            const pInput = document.getElementById('victor-percent');
            const vInput = document.getElementById('victor-video');
            if (!nInput.value || !pInput.value || !vInput.value || selectedId === null) { alert("Заполните поля!"); return; }
            
            try {
                const res = await fetch('/api/demons/add-victor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-code': adminCode },
                    body: JSON.stringify({ id: selectedId, name: nInput.value, percent: parseInt(pInput.value), video: vInput.value })
                });
                if (res.ok) { alert("Рекорд записан для всех!"); nInput.value = ''; pInput.value = '100'; vInput.value = ''; }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
