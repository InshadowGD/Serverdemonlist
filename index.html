<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Server Demonlist</title>
    
    <!-- ПОДКЛЮЧАЕМ СКРИПТ ЖИВОГО ОБЛАКА SUPABASE -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body { 
            background: radial-gradient(circle at top, #1a1c23 0%, #0f1015 100%); 
            color: #f1f2f6; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }
        .container { display: flex; gap: 35px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
        .main-content { flex: 2; background: rgba(23, 24, 28, 0.6); padding: 30px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 25px; position: -webkit-sticky; position: sticky; top: 40px; overflow: visible; }
        .panel { background: rgba(28, 29, 34, 0.8); padding: 25px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; margin-top: 0; margin-bottom: 25px; background: linear-gradient(45deg, #ff4a4a, #ffb84d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.4rem; font-weight: 700; margin-top: 0; margin-bottom: 20px; color: #fff; border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .demon-card-wrapper { 
            background: rgba(33, 35, 41, 0.5); 
            margin: 15px 0; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 74, 74, 0.15);
            border-left: 6px solid #ff4a4a; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .demon-card-wrapper:hover { 
            transform: translateY(-4px);
            background: rgba(40, 43, 51, 0.7);
            border-color: rgba(255, 74, 74, 0.4);
            box-shadow: 0 10px 20px rgba(255, 74, 74, 0.1);
        }
        .demon-card-wrapper.active { 
            border-left-color: #00ff66; 
            border-color: rgba(0, 255, 102, 0.3);
            background: linear-gradient(90deg, rgba(30, 41, 34, 0.6) 0%, rgba(24, 26, 31, 0.6) 100%); 
            box-shadow: 0 10px 25px rgba(0, 255, 102, 0.15);
        }
        
        .demon-card-wrapper h3 { font-size: 1.3rem; margin: 0 0 8px 0; color: #fff; font-weight: 700; }
        .demon-card-wrapper p { color: #9da2af; font-size: 0.95rem; margin: 0; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #8a8d98; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 8px; background: #121316; border: 1px solid #2d3039; color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        input:focus { border-color: #ff4a4a; outline: none; }
        
        button { width: 100%; padding: 12px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px; border: none; border-radius: 8px; transition: all 0.2s; }
        
        .victors-list { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
        .victors-list strong { color: #ffb84d; display: block; margin-bottom: 8px; font-size: 0.9rem; text-transform: uppercase; }
        .victor-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin: 6px 0; }
        .video-btn { color: #4af3ff; text-decoration: none; font-weight: 600; }
        .video-btn:hover { text-shadow: 0 0 8px #4af3ff; color: #fff; }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th { text-align: left; padding: 8px; color: #8a8d98; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .leaderboard-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 0.95rem; }
        .rank-badge { display: inline-block; width: 22px; height: 24px; text-align: center; line-height: 22px; border-radius: 50%; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-content">
            <h1>Server Demonlist</h1>
            <div id="demons-list">Синхронизация с живой базой...</div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <h2 id="form-title">Добавить уровень</h2>
                <div class="form-group"><label>Позиция</label><input type="number" id="form-position"></div>
                <div class="form-group"><label>Название</label><input type="text" id="form-name"></div>
                <div class="form-group"><label>Создатель</label><input type="text" id="form-creator"></div>
                <div class="form-group"><label>Верификатор</label><input type="text" id="form-verifier"></div>
                <div class="form-group"><label style="color: #ffb84d;">📉 Минимальный процент листа (%)</label><input type="number" id="form-min-percent" value="100" min="0" max="100"></div>
                
                <div class="form-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1);">
                    <label style="color: #ffb84d; font-weight: bold;">🔑 Код администратора</label>
                    <input type="password" id="form-admin-code" placeholder="Введите ваш секретный код">
                </div>

                <button onclick="saveDemonChanges()" style="background: linear-gradient(135deg, #ff4a4a 0%, #dd2a2a 100%); color:#fff;">Сохранить уровень</button>
                <button id="btn-cancel-edit" onclick="createNewDemonFields()" style="background:#4a4d55; color:#fff; display:none;">Отменить редактирование</button>
                <button id="btn-clear-fields" onclick="clearFormInputOnly()" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid rgba(255,255,255,0.1);">Очистить поля</button>
                <button id="btn-delete-demon" onclick="deleteDemon()" style="background: linear-gradient(135deg, #cc2424 0%, #a01818 100%); color:#fff; display:none;">Удалить этот уровень</button>
            </div>

            <div class="panel" id="victor-panel" style="display: none;">
                <h2>Добавить рекорд</h2>
                <div class="form-group"><label>Игрок (Виктор)</label><input type="text" id="victor-name"></div>
                <div class="form-group"><label>Набранный процент (%)</label><input type="number" id="victor-percent" value="100" min="0" max="100"></div>
                <div class="form-group"><label>Видео (YouTube)</label><input type="url" id="victor-video"></div>
                <button onclick="addVictor()" style="background: linear-gradient(135deg, #00ff66 0%, #00c850 100%); color:#000;">Записать рекорд</button>
            </div>

            <div class="panel">
                <h2>🏆 Топ-5 лидеров</h2>
                <div id="leaderboard-content">Подсчет очков...</div>
            </div>
        </div>
    </div>

    <script>
        const SECRET_ADMIN_CODE = '090909';
        let selectedId = null;
        let globalDemonsList = [];

        // ВЫДЕЛЕННЫЕ КЛЮЧИ ИНТЕРНЕТ-ОБЛАКА SUPABASE
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1bmJpeHNrYmJ5d3VuYml4c2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTI4OTAwMDAsImV4cCI6MjAyODg5MDAwMH0.1v8XbV7_N9tB_5y_mC8Sly23nIeQ59L5L_hKW";
        
        // ИСПРАВЛЕНО: Дали правильное имя переменной, чтобы код больше не падал!
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = function() { 
            listenRealtimeCloud(); 
        };

        function checkAdmin() {
            const inputCode = document.getElementById('form-admin-code').value;
            if (inputCode !== SECRET_ADMIN_CODE) {
                alert("Ошибка: Неверный код администратора!");
                return false;
            }
            return true;
        }
        function calculatePoints(position, percent, minPercent, totalDemons) {
            if (percent < minPercent) return 0;
            let maxPoints = 250 - (position - 1) * (200 / Math.max(totalDemons, 1));
            if (maxPoints < 10) maxPoints = 10; 
            if (parseInt(percent) === 100) {
                return Math.round(maxPoints * 10) / 10;
            } else {
                let percentPoints = maxPoints * ((percent - minPercent) / (100 - minPercent)) * 0.6;
                return Math.round(percentPoints * 10) / 10;
            }
        }

        async function listenRealtimeCloud() {
            const { data } = await _supabase.from('demonlist').select('record_json').eq('id', 1).single();
            globalDemonsList = data && data.record_json ? data.record_json : [];
            renderDOM();

            _supabase.channel('schema-db-changes')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'demonlist' }, payload => {
                    globalDemonsList = payload.new.record_json || [];
                    renderDOM();
                }).subscribe();
        }

        function renderDOM() {
            const list = document.getElementById('demons-list');
            if (!globalDemonsList || globalDemonsList.length === 0) { 
                list.innerHTML = 'Лист пуст.'; 
                document.getElementById('leaderboard-content').innerHTML = 'Пока нет записанных рекордов.';
                return; 
            }
            
            globalDemonsList.sort((a, b) => a.position - b.position);
            let playerScores = {};
            let newHtml = '';

            globalDemonsList.forEach(d => {
                const isSelected = selectedId === d.id;
                let posColor = d.position === 1 ? '#ffd700' : d.position === 2 ? '#c0c0c0' : d.position === 3 ? '#cd7f32' : '#ff4a4a';
                
                newHtml += `<div class="demon-card-wrapper ${isSelected ? 'active' : ''}" style="border-left-color: ${posColor}">
                    <div onclick='selectDemon(${JSON.stringify(d)})'>
                        <h3><span style="color: ${posColor}">#${d.position}</span> - ${d.name}</h3>
                        <p>Создатель: <span style="color:#fff">${d.creator}</span> | Верификатор: <span style="color:#fff">${d.verifier || 'Не указан'}</span> | Мин. процент: <span style="color:#ffb84d">${d.minPercent || 100}%</span></p>
                    </div>`;

                if (d.victors && d.victors.length > 0) {
                    newHtml += `<div class="victors-list"><strong>🏆 Рекорды:</strong>`;
                    d.victors.forEach(v => {
                        let pts = calculatePoints(d.position, v.percent || 100, d.minPercent || 100, globalDemonsList.length);
                        newHtml += `<div class="victor-item">
                            <span>👤 <b>${v.name}</b> — ${v.percent}% (<span style="color:#00ff66">+${pts} PTS</span>)</span>
                            <a href="${v.video}" target="_blank" class="video-btn">🎬 Видео</a>
                        </div>`;
                        playerScores[v.name] = (playerScores[v.name] || 0) + pts;
                    });
                    newHtml += `</div>`;
                }
                newHtml += `</div>`;
            });

            list.innerHTML = newHtml;
            renderLeaderboard(playerScores);
        }

        function renderLeaderboard(scores) {
            const board = document.getElementById('leaderboard-content');
            let sorted = Object.keys(scores).map(n => ({ name: n, score: Math.round(scores[n] * 10) / 10 })).sort((a,b) => b.score - a.score).slice(0, 5); 
            if (sorted.length === 0) { board.innerHTML = 'Пока нет записанных рекордов.'; return; }
            let html = `<table class="leaderboard-table"><tr><th>Место</th><th>Игрок</th><th>Очки</th></tr>`;
            sorted.forEach((p, i) => {
                let clr = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : 'rgba(255,255,255,0.1)';
                html += `<tr><td><span class="rank-badge" style="background:${clr}; color:${i<3?'#000':'#fff'}">${i+1}</span></td><td><b>${p.name}</b></td><td style="color:#00ff66;font-weight:bold;">${p.score}</td></tr>`;
            });
            board.innerHTML = html + `</table>`;
        }

        function selectDemon(demon) {
            selectedId = demon.id;
            document.getElementById('form-title').innerText = "Редактировать уровень";
            document.getElementById('form-position').value = demon.position; document.getElementById('form-name').value = demon.name;
            document.getElementById('form-creator').value = demon.creator; document.getElementById('form-verifier').value = demon.verifier || '';
            document.getElementById('form-min-percent').value = demon.minPercent || 100;
            document.getElementById('btn-delete-demon').style.display = 'block'; document.getElementById('btn-cancel-edit').style.display = 'block';
            document.getElementById('btn-clear-fields').style.display = 'none'; document.getElementById('victor-panel').style.display = 'block';
        }

        function createNewDemonFields() { selectedId = null; document.getElementById('form-title').innerText = "Добавить уровень"; clearFormInputOnly(); document.getElementById('btn-delete-demon').style.display = 'none'; document.getElementById('btn-cancel-edit').style.display = 'none'; document.getElementById('btn-clear-fields').style.display = 'block'; document.getElementById('victor-panel').style.display = 'none'; }
        function clearFormInputOnly() { document.getElementById('form-position').value = ''; document.getElementById('form-name').value = ''; document.getElementById('form-creator').value = ''; document.getElementById('form-verifier').value = ''; document.getElementById('form-admin-code').value = ''; }

        async function saveDemonChanges() {
            if (!checkAdmin()) return;
            const p = document.getElementById('form-position').value; const n = document.getElementById('form-name').value;
            const c = document.getElementById('form-creator').value; const v = document.getElementById('form-verifier').value || 'Не указан';
            const m = document.getElementById('form-min-percent').value;
            if (!p || !n || !c || !m) { alert("Заполните поля!"); return; }

            if (selectedId !== null) {
                const demon = globalDemonsList.find(d => d.id === selectedId);
                if (demon) { demon.position = parseInt(p); demon.name = n; demon.creator = c; demon.verifier = v; demon.minPercent = parseInt(m); }
            } else {
                globalDemonsList.push({ id: "id_" + Date.now(), position: parseInt(p), name: n, creator: c, verifier: v, minPercent: parseInt(m), victors: [] });
            }

            await _supabase.from('demonlist').update({ record_json: globalDemonsList }).eq('id', 1);
            alert("Успешно сохранено для всех!"); createNewDemonFields();
        }

        async function deleteDemon() {
            if (!checkAdmin() || !confirm("Вы уверены?")) return;
            globalDemonsList = globalDemonsList.filter(d => d.id !== selectedId);
            await _supabase.from('demonlist').update({ record_json: globalDemonsList }).eq('id', 1);
            alert("Удалено!"); createNewDemonFields();
        }

        async function addVictor() {
            if (!checkAdmin()) return;
            const n = document.getElementById('victor-name'); const p = document.getElementById('victor-percent'); const v = document.getElementById('victor-video');
            if (!n.value || !p.value || !v.value || selectedId === null) { alert("Заполните поля!"); return; }
            
            const demon = globalDemonsList.find(d => d.id === selectedId);
            if (demon) {
                if (parseInt(p.value) < demon.minPercent) { alert(`Ошибка: Процент меньше лимита листа (${demon.minPercent}%)!`); return; }
                if (!demon.victors) demon.victors = [];
                demon.victors.push({ name: n.value, percent: parseInt(p.value), video: v.value });
                
                await _supabase.from('demonlist').update({ record_json: globalDemonsList }).eq('id', 1);
                alert("Рекорд записан!"); n.value = ''; p.value = '100'; v.value = '';
            }
        }
    </script>
</body>
</html>
